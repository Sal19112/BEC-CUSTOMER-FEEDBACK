<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Ansari Exchange Customer Feedback</title>
<style>
  :root{
    --blue:#2B3990;
    --blue-dark:#232E75;
    --blue-deep:#1A2258;
    --blue-tint:#EBEDF8;
    --blue-tint-2:#D6DAF0;
    --ink:#1C2140;
    --muted:#5F6480;
    --line:#DEE1F0;
    --bg:#F3F4FA;
    --card:#FFFFFF;
    --ok:#1B8A4C;
    --warn:#B3261E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Segoe UI',Tahoma,system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .topbar{
    width:100%;
    height:6px;
    background:linear-gradient(90deg,var(--blue) 0%,var(--blue-dark) 100%);
  }
  .band{
    width:100%;
    background:var(--card);
    padding:16px 20px 60px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .lang-switch{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
  }
  .lang-switch .pill{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    border:1.5px solid var(--blue-tint-2);
    border-radius:18px;
    overflow:hidden;
    background:var(--blue-tint);
  }
  .lang-switch button{
    border:none;
    background:transparent;
    padding:8px 13px;
    font:inherit;
    font-size:13px;
    font-weight:700;
    color:var(--blue);
    cursor:pointer;
  }
  .lang-switch button.on{
    background:var(--blue);
    color:#fff;
  }
  .band img.logo{
    height:58px;
    max-width:70%;
    object-fit:contain;
  }
  .band h1{
    margin-top:16px;
    font-size:21px;
    font-weight:800;
    color:var(--blue);
    letter-spacing:.2px;
  }
  .band p{
    margin-top:6px;
    font-size:14px;
    color:var(--muted);
    line-height:1.6;
  }
  .card{
    width:min(440px,calc(100% - 32px));
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 10px 30px rgba(43,57,144,.12);
    margin:-34px 0 40px;
    padding:26px 22px 28px;
  }
  .field{margin-bottom:22px;}
  .label{
    display:block;
    font-size:13px;
    font-weight:700;
    letter-spacing:.3px;
    color:var(--blue);
    margin-bottom:8px;
    line-height:1.5;
  }
  html[lang=en] .label{text-transform:uppercase;letter-spacing:.4px;}
  .label .req{color:var(--warn);}
  .label .opt{font-weight:500;color:var(--muted);text-transform:none;}
  .branch-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--blue-tint);
    border:1.5px solid var(--blue-tint-2);
    border-radius:10px;
    padding:12px 14px;
    font-size:16px;
    font-weight:600;
    color:var(--blue-deep);
  }
  .branch-box .pin{color:var(--blue);font-size:18px;}
  input[type=tel]{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font:inherit;
    font-size:16px;
    color:var(--ink);
    background:#fff;
  }
  input[type=tel]:focus{outline:none;border-color:var(--blue);}
  select{
    width:100%;
    border:1.5px solid var(--blue-tint-2);
    border-radius:10px;
    padding:12px 14px;
    font:inherit;
    font-size:16px;
    font-weight:600;
    color:var(--blue-deep);
    background:var(--blue-tint);
    appearance:auto;
  }
  select:focus{outline:none;border-color:var(--blue);}
  .stars{
    display:flex;
    gap:8px;
    direction:ltr;
  }
  .stars button{
    flex:1;
    aspect-ratio:1.15/1;
    max-height:58px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    font-size:26px;
    color:#C9CDE4;
    cursor:pointer;
    transition:transform .08s ease,color .12s ease,border-color .12s ease,background .12s ease;
  }
  .stars button:active{transform:scale(.92);}
  .stars button.on{
    color:var(--blue);
    border-color:var(--blue);
    background:var(--blue-tint);
  }
  .stars button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .nps{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
  }
  .nps button{
    padding:11px 0;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    font:inherit;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    transition:transform .08s ease,border-color .12s ease,background .12s ease;
  }
  .nps button:active{transform:scale(.93);}
  .nps button.on{
    border-color:var(--blue);
    background:var(--blue);
    color:#fff;
  }
  .nps button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .rate-hint{
    margin-top:7px;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    min-height:18px;
  }
  textarea{
    width:100%;
    min-height:96px;
    resize:vertical;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font:inherit;
    font-size:15px;
    color:var(--ink);
    background:#fff;
  }
  textarea:focus{outline:none;border-color:var(--blue);}
  .submit{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);
    color:#fff;
    font-size:16px;
    font-weight:700;
    letter-spacing:.3px;
    cursor:pointer;
    transition:filter .15s ease,transform .08s ease;
  }
  .submit:active{transform:scale(.985);}
  .submit:hover{filter:brightness(1.08);}
  .submit:disabled{background:#BCC1DB;cursor:not-allowed;}
  .error{
    margin-top:12px;
    font-size:13.5px;
    color:var(--warn);
    text-align:center;
    min-height:18px;
  }
  .success{
    display:none;
    text-align:center;
    padding:30px 8px 12px;
  }
  .success .tick{
    width:72px;height:72px;
    margin:0 auto 18px;
    border-radius:50%;
    background:var(--blue);
    color:#fff;
    font-size:38px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(43,57,144,.35);
  }
  .success h2{font-size:21px;margin-bottom:8px;color:var(--blue-deep);}
  .success p{font-size:14.5px;color:var(--muted);line-height:1.6;}
  footer{
    font-size:12px;
    color:var(--muted);
    padding-bottom:26px;
    text-align:center;
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;}
  }
</style>
</head>

<div class="topbar"></div>

  <h1 data-i18n="title">Thank you for using Al Ansari Exchange</h1>
  <p data-i18n="subtitle">We appreciate your trust in Al Ansari Exchange.<br>Please take a moment to tell us about your visit.</p>
</div>

<div class="card">

  <form id="fbForm" novalidate>
    <div class="field">
      <label class="label" data-i18n="branchLabel">Branch Name</label>

      <select id="branchSelect" style="display:none">
        <option value="">Loading branches...</option>
      </select>
    </div>

    <div class="field">
      <label class="label"><span data-i18n="civilLabel">&#128100; Civil ID Number</span> <span class="req">*</span></label>
      <input type="tel" id="civilId" inputmode="numeric" maxlength="12" data-i18n-ph="civilPh" placeholder="12-digit Civil ID" autocomplete="off">
    </div>

    <div class="field">
      <label class="label"><span data-i18n="mobileLabel">&#128241; Mobile Number</span> <span class="req">*</span></label>
      <input type="tel" id="mobile" inputmode="numeric" maxlength="8" data-i18n-ph="mobilePh" placeholder="8-digit mobile number" autocomplete="tel">
    </div>

    <div class="field">
      <label class="label" data-i18n="q1">&#11088; 1. How satisfied were you with your visit today?</label>
      <div class="stars" id="happyStars" role="radiogroup" aria-label="Happy with service rating"></div>
      <div class="rate-hint" id="happyHint">Tap to rate</div>
    </div>

    <div class="field">
      <label class="label" data-i18n="q2">&#129309; 2. Did our staff treat you with respect?</label>
      <div class="stars" id="respectStars" role="radiogroup" aria-label="Respect and smile rating"></div>
      <div class="rate-hint" id="respectHint">Tap to rate</div>
    </div>

    <div class="field">
      <label class="label" data-i18n="q3">&#9889; 3. Were you served quickly?</label>
      <div class="stars" id="speedStars" role="radiogroup" aria-label="Service speed rating"></div>
      <div class="rate-hint" id="speedHint">Tap to rate</div>
    </div>

    <div class="field">
      <label class="label" data-i18n="q4">&#10084;&#65039; 4. Would you visit us again?</label>
      <div class="stars" id="visitStars" role="radiogroup" aria-label="Visit again rating"></div>
      <div class="rate-hint" id="visitHint">Tap to rate</div>
    </div>


    <div class="field">
      <label class="label" data-i18n="q6nps">&#128202; 5. How likely are you to recommend us to your family and friends?</label>
      <div class="nps" id="npsGrid" role="radiogroup" aria-label="Recommendation likelihood 0 to 10"></div>
      <div class="rate-hint" data-i18n="npsHint">1 = Not at all likely &middot; 10 = Extremely likely</div>
    </div>

    <div class="field">
      <label class="label"><span data-i18n="q6">&#128172; 6. How can we improve our service?</span> <span class="opt" data-i18n="optional">(optional)</span></label>
      <textarea id="improve" maxlength="500" data-i18n-ph="improvePh" placeholder="Your suggestions..."></textarea>
    </div>

    <button type="submit" class="submit" id="submitBtn" data-i18n="submit">Submit Feedback</button>
    <div class="error" id="errMsg"></div>
  </form>

  <div class="success" id="successBox">
    <div class="tick">&#10003;</div>
    <h2 data-i18n="thanks">Thank you!</h2>
    <p id="successMsg"></p>
  </div>

</div>

<footer data-i18n="footer">&copy; Al Ansari Exchange &middot; Kuwait</footer>

const params = new URLSearchParams(location.search);
let lang = ["ar","hi","bn","si"].includes(params.get("lang")) ? params.get("lang") : "en";
function t(key){ return I18N[lang][key]; }

/* ---------- Branch ---------- */
const paramBranch = (params.get("branch") || "").trim();
const branchBox = document.getElementById("branchBox");
const branchSelect = document.getElementById("branchSelect");
let branchLoadState = "loading"; // loading | ready | empty | error
let branchList = [];

function getBranch(){
  return paramBranch || branchSelect.value.trim();
}

function renderBranchSelect(){
  const current = branchSelect.value;
  branchSelect.innerHTML = "";
  const ph = document.createElement("option");
  ph.value = "";
  ph.textContent = branchLoadState === "loading" ? t("branchLoading")
    : branchLoadState === "error" ? t("branchError")
    : branchList.length ? t("branchSelect") : t("branchNone");
  branchSelect.appendChild(ph);
  branchList.forEach(name => {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = name;
    branchSelect.appendChild(o);
  });
  if(current) branchSelect.value = current;
}

if(paramBranch){
  branchBox.style.display = "flex";
  document.getElementById("branchName").textContent = paramBranch;
}else{
  branchSelect.style.display = "block";
  renderBranchSelect();
  fetch(SCRIPT_URL + "?action=branches")
    .then(r => r.json())
    .then(data => {
      branchList = (data && data.branches) || [];
      branchLoadState = branchList.length ? "ready" : "empty";
      renderBranchSelect();
    })
    .catch(() => {
      branchLoadState = "error";
      renderBranchSelect();
    });
}

/* ---------- Star ratings ---------- */
const state = { happy: 0, respect: 0, speed: 0, visit: 0 };
const starMeta = {
  happy: {box: "happyStars", hint: "happyHint"},
  respect: {box: "respectStars", hint: "respectHint"},
  speed: {box: "speedStars", hint: "speedHint"},
  visit: {box: "visitStars", hint: "visitHint"}
};

function updateHint(key){
  const hint = document.getElementById(starMeta[key].hint);
  const v = state[key];
  if(!v){
    hint.textContent = t("tapToRate");
    hint.style.color = "var(--muted)";
  }else{
    hint.textContent = t("starLabels")[v];
    hint.style.color = v >= 4 ? "var(--ok)" : (v <= 2 ? "var(--warn)" : "var(--muted)");
  }
}

function buildStars(key){
  const box = document.getElementById(starMeta[key].box);
  for(let i = 1; i <= 5; i++){
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "★";
    b.setAttribute("role","radio");
    b.setAttribute("aria-label", i + " star" + (i>1?"s":""));
    b.addEventListener("click", () => {
      state[key] = i;
      [...box.children].forEach((el, idx) => el.classList.toggle("on", idx < i));
      updateHint(key);
    });
    box.appendChild(b);
  }
}
buildStars("happy");
buildStars("respect");
buildStars("speed");
buildStars("visit");

/* ---------- NPS 0-10 ---------- */
let npsValue = -1;
const npsGrid = document.getElementById("npsGrid");
for(let i = 1; i <= 10; i++){
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = i;
  b.setAttribute("role","radio");
  b.setAttribute("aria-label", "Score " + i);
  b.addEventListener("click", () => {
    npsValue = i;
    [...npsGrid.children].forEach(el => el.classList.toggle("on", el === b));
  });
  npsGrid.appendChild(b);
}

/* ---------- Language switching ---------- */
const langEn = document.getElementById("langEn");
const langAr = document.getElementById("langAr");
const langHi = document.getElementById("langHi");
const langBn = document.getElementById("langBn");
const langSi = document.getElementById("langSi");

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  langEn.classList.toggle("on", lang === "en");
  langAr.classList.toggle("on", lang === "ar");
  langHi.classList.toggle("on", lang === "hi");
  langBn.classList.toggle("on", lang === "bn");
  langSi.classList.toggle("on", lang === "si");

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const txt = t(el.dataset.i18n);
    if(txt.includes("\n")){
      el.innerHTML = "";
      txt.split("\n").forEach((part, i) => {
        if(i) el.appendChild(document.createElement("br"));
        el.appendChild(document.createTextNode(part));
      });
    }else{
      el.textContent = txt;
    }
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });

  renderBranchSelect();
  updateHint("happy");
  updateHint("respect");
  updateHint("speed");
  updateHint("visit");
  if(!btn.disabled) btn.textContent = t("submit");
  err.textContent = "";
}

langEn.addEventListener("click", () => { lang = "en"; applyLang(); });
langAr.addEventListener("click", () => { lang = "ar"; applyLang(); });
langHi.addEventListener("click", () => { lang = "hi"; applyLang(); });
langBn.addEventListener("click", () => { lang = "bn"; applyLang(); });
langSi.addEventListener("click", () => { lang = "si"; applyLang(); });

/* ---------- Submit ---------- */
const form = document.getElementById("fbForm");
const btn = document.getElementById("submitBtn");
const err = document.getElementById("errMsg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";

  const branch = getBranch();
  if(!branch){
    err.textContent = t("errBranch");
    return;
  }

  const civilId = document.getElementById("civilId").value.trim();
  if(!/^\d{12}$/.test(civilId)){
    err.textContent = t("errCivil");
    return;
  }

  const mobile = document.getElementById("mobile").value.trim();
  if(!/^\d{8}$/.test(mobile)){
    err.textContent = t("errMobile");
    return;
  }

  if(!state.happy || !state.respect || !state.speed || !state.visit){
    err.textContent = t("errStars");
    return;
  }
  if(npsValue < 1){
    err.textContent = t("errNps");
    return;
  }

  const msg = document.getElementById("successMsg");
  msg.innerHTML = "";
  t("successMsg").replace("{branch}", branch).split("\n").forEach((part, i) => {
    if(i) msg.appendChild(document.createElement("br"));
    msg.appendChild(document.createTextNode(part));
  });

  btn.disabled = true;
  btn.textContent = t("submitting");

  const payload = {
    branch: branch,
    civilId: civilId,
    mobile: mobile,
    happy: state.happy,
    respect: state.respect,
    speed: state.speed,
    visitAgain: state.visit,
    nps: npsValue,
    improve: document.getElementById("improve").value.trim()
  };

  try{
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    form.style.display = "none";
    document.getElementById("successBox").style.display = "block";
  }catch(ex){
    err.textContent = t("errSubmit");
    btn.disabled = false;
    btn.textContent = t("submit");
  }
});

applyLang();
</script>
